# 比色管检测数据集配置（YOLO 格式，单类）
#
# ⚠️ path 是相对**仓库根目录**解析的（ultralytics 对相对 path 的解析依赖运行
# 时的 CWD，2026-10-13 实测）——请按 README 约定在仓库根目录运行：
#     python 模型/train.py --data 模型/data/data.yaml
# train.py 内部还会把 path 固化成绝对路径，换任何 CWD 都不会失效。

path: 模型/dataset     # 数据集根
train: images/train
val: images/val

# 类别
names:
  0: tube          # 比色管（整根：管口到管底可见部分；液柱颜色不定，含近无色管）
